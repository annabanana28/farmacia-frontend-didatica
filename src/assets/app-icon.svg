<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="farmaciaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo de Emblema Moderno de Farmácia -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#farmaciaGrad)" filter="url(#glow)" />

  <!-- Cruz Farmacêutica em Branco Puro com Cantos Suaves -->
  <path d="M46 25 C46 22.8 47.8 21 50 21 L70 21 C72.2 21 74 22.8 74 25 L74 46 L95 46 C97.2 46 99 47.8 99 50 L99 70 C99 72.2 97.2 74 95 74 L74 74 L74 95 C74 97.2 72.2 99 70 99 L50 99 C47.8 99 46 97.2 46 95 L46 74 L25 74 C22.8 74 21 72.2 21 70 L21 50 C21 47.8 22.8 46 25 46 L46 46 Z" fill="#FFFFFF" />

  <!-- Cápsula / Pílula Central Estilizada -->
  <g transform="rotate(-45 60 60)">
    <!-- Metade 1 da Cápsula (Esmeralda) -->
    <path d="M52 42 C52 37.6 55.6 34 60 34 C64.4 34 68 37.6 68 42 L68 59 L52 59 Z" fill="url(#pillGrad)" />
    <!-- Metade 2 da Cápsula (Branca / Prata) -->
    <path d="M52 61 L68 61 L68 78 C68 82.4 64.4 86 60 86 C55.6 86 52 82.4 52 78 Z" fill="#E2E8F0" />
    <!-- Linha divisória da cápsula -->
    <line x1="51" y1="60" x2="69" y2="60" stroke="#047857" stroke-width="1.5" />
    <!-- Brilho na cápsula -->
    <ellipse cx="56" cy="46" rx="1.5" ry="5" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>
